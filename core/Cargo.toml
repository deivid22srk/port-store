[package]
name = "portstore_core"
version = "1.0.0"
edition = "2021"
description = "Port Store download engine (segmented, resumable) exposed to Android via JNI"
license = "MIT"

[lib]
name = "portstore_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "http2", "stream"] }
# ring provider explicito (sem OpenSSL/aws-lc): cross-compile Android seguro
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# wreq = sucessor do reqwest com IMPERSONAÇÃO de navegador (BoringSSL +
# fingerprint TLS/JA4 + HTTP/2 de Chrome) — o Buzzheavier (Cloudflare) DESAFIA
# (403 cf-mitigated) clientes com fingerprint rustls/hyper MESMO em IP
# residencial; a ferramenta de referência (buzzheavier-tool) passa porque usa
# curl_cffi impersonate="chrome" — wreq é o equivalente Rust disso.
# (rquest = nome antigo, todas as versões yanked; projeto virou wreq)
# Descompressão obrigatória: a emulação anuncia gzip/deflate/br/zstd.
wreq = { version = "6.0.0-rc", default-features = true, features = ["stream", "gzip", "deflate", "brotli", "zstd"] }
wreq-util = "3.0.0-rc"
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jni = "0.21.1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic = "unwind" (padrao): panics em tasks viram JoinError e viram estado
# Failed; panics nos limites JNI sao capturados com catch_unwind. Isso evita
# que um bug pontual derrube o app inteiro.
