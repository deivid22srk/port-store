name: Release APK

# Publica uma versão oficial do Port Store:
#   1. Compila o APK em release (mesma configuração do build.yml).
#   2. Assina com a keystore oficial (GitHub Secrets).
#   3. Publica o APK assinado nas Releases do GitHub com notas automáticas.
#
# Disparo: push de tag "v*" (ex.: v1.2.0) ou execução manual.
# NÃO dispare por conta própria — só sob pedido.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para publicar (ex.: v1.2.0). Opcional ao disparar a partir de uma tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag
        run: |
          echo "Tag: $TAG_NAME"
          case "$TAG_NAME" in
            v[0-9]*) echo "Padrão v* OK" ;;
            *) echo "::error::A tag '$TAG_NAME' não segue o padrão v* (ex.: v1.2.0)"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null \
            || { echo "::error::Tag '$TAG_NAME' não existe no repositório"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components (NDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust unit tests (host)
        run: cargo test --release
        working-directory: core

      - name: Build Rust libs (arm64-v8a, armeabi-v7a, x86_64)
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
        working-directory: core

      # O release EXIGE a keystore oficial: sem ela o APK não atualizaria
      # para quem já tem o app instalado. Não há fallback efêmero aqui.
      - name: Prepare release keystore (obrigatória)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 ausente. Configure os 4 secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) antes de publicar."
            exit 1
          fi
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v ausente"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/portstore.jks"
          echo "PORTSTORE_KEYSTORE=$RUNNER_TEMP/portstore.jks" >> "$GITHUB_ENV"
          echo "PORTSTORE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PORTSTORE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PORTSTORE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # versionName vem da tag (sem o "v"); versionCode cresce com a versão:
      # major*10000 + minor*100 + patch (ex.: v1.2.3 -> 10203).
      - name: Compute version from tag
        id: ver
        run: |
          VERSION="${TAG_NAME#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1 | grep -oE '^[0-9]+' || true)
          MINOR=$(echo "$VERSION" | cut -d. -f2 | grep -oE '^[0-9]+' || true)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | grep -oE '^[0-9]+' || true)
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::Use minor e patch <= 99 para manter o versionCode crescente."
            exit 1
          fi
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "Versão: $VERSION (versionCode $CODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Rename APK
        id: meta
        run: |
          OUT="app/build/outputs/apk/release"
          APK=$(ls "$OUT"/*.apk | head -n 1)
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK")
          VNAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" | head -n1)
          VCODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+" | head -n1)
          echo "APK: versionName=$VNAME versionCode=$VCODE"
          [ "$VNAME" = "${TAG_NAME#v}" ] || {
            echo "::error::versionName do APK ($VNAME) difere da tag ($TAG_NAME)"; exit 1;
          }
          NAME="PortStore-${TAG_NAME}.apk"
          cp "$APK" "$OUT/$NAME"
          echo "apk=$OUT/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Port Store ${{ steps.ver.outputs.version }}
          body: |
            APK release assinado do Port Store.

            - Versão: ${{ steps.ver.outputs.version }} (versionCode ${{ steps.ver.outputs.code }})
            - ABIs: arm64-v8a, armeabi-v7a, x86_64
            - Instalação direta; o app também oferece atualização automática.
          files: ${{ steps.meta.outputs.apk }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: "true"
