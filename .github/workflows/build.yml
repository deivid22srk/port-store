name: Build APK

# Apenas compila o APK e publica como artifact da execução.
# NADA é publicado nas Releases do GitHub aqui — para isso existe release.yml.

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components (NDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust unit tests (host)
        run: cargo test --release
        working-directory: core

      - name: Build Rust libs (arm64-v8a, armeabi-v7a, x86_64)
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release
        working-directory: core

      # O wreq (BoringSSL/btls) liga o libportstore_core.so contra a libc++
      # COMPARTILHADA do NDK. Sem libc++_shared.so no APK o dlopen falha no
      # aparelho e TODOS os downloads morrem em silêncio ("Conectando…" eterno
      # — NativeDownloader.available=false engole o erro). Copia a lib do
      # sysroot do NDK e verifica as dependências (DT_NEEDED) de cada .so.
      - name: Package libc++_shared.so + verificar dependências nativas
        run: |
          set -e
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          declare -A TRIPLE=( [arm64-v8a]=aarch64-linux-android [armeabi-v7a]=arm-linux-androideabi [x86_64]=x86_64-linux-android )
          for abi in arm64-v8a armeabi-v7a x86_64; do
            dir="app/src/main/jniLibs/$abi"
            [ -d "$dir" ] || { echo "::error::app/src/main/jniLibs/$abi não existe (cargo-ndk falhou?)"; exit 1; }
            src="$TC/sysroot/usr/lib/${TRIPLE[$abi]}/libc++_shared.so"
            if [ -f "$src" ]; then
              cp "$src" "$dir/libc++_shared.so"
              echo "empacotado: $dir/libc++_shared.so"
            else
              echo "::error::libc++_shared.so ausente no NDK: $src"; exit 1
            fi
          done
          # Cada NEEDED de cada .so precisa existir no APK ou ser lib do sistema.
          FAIL=0
          for so in app/src/main/jniLibs/*/*.so; do
            abi="$(basename "$(dirname "$so")")"
            while IFS= read -r needed; do
              [ -z "$needed" ] && continue
              case "$needed" in
                libc.so|libdl.so|libm.so|liblog.so|libandroid.so|libz.so|libdl_android.so|libstdc++.so) continue ;;
              esac
              if [ ! -f "app/src/main/jniLibs/$abi/$needed" ]; then
                echo "::error::$abi: '$so' precisa de '$needed' que NÃO será empacotada (dlopen falharia no aparelho)"
                FAIL=1
              fi
            done < <("$TC/bin/llvm-readelf" -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\].*/\1/p')
          done
          [ "$FAIL" -eq 0 ] || { echo "::error::Dependências nativas faltando no APK"; exit 1; }
          echo "Dependências nativas OK:"
          ls -la app/src/main/jniLibs/*/

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Usando keystore dos secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/portstore.jks"
            echo "PORTSTORE_KEYSTORE=$RUNNER_TEMP/portstore.jks" >> "$GITHUB_ENV"
            echo "PORTSTORE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PORTSTORE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PORTSTORE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Sem secrets: gerando keystore efêmera no CI"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/portstore.jks" \
              -alias portstore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass portstore_ci_2026 -keypass portstore_ci_2026 \
              -dname "CN=Port Store, OU=Hail Games, O=deivid22srk, L=BR, ST=BR, C=BR"
            echo "PORTSTORE_KEYSTORE=$RUNNER_TEMP/portstore.jks" >> "$GITHUB_ENV"
            echo "PORTSTORE_KEYSTORE_PASSWORD=portstore_ci_2026" >> "$GITHUB_ENV"
            echo "PORTSTORE_KEY_ALIAS=portstore" >> "$GITHUB_ENV"
            echo "PORTSTORE_KEY_PASSWORD=portstore_ci_2026" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        id: meta
        run: |
          OUT="app/build/outputs/apk/release"
          APK=$(ls "$OUT"/*.apk | head -n 1)
          # Lê a versão real do APK (versionName é dinâmico no gradle).
          BADGING=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK")
          VERSION=$(echo "$BADGING" | grep -oP "versionName='\K[^']+" | head -n1)
          CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+" | head -n1)
          echo "Versão: $VERSION (code $CODE)"
          NAME="PortStore-${VERSION}-${GITHUB_SHA::8}.apk"
          cp "$APK" "$OUT/$NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
